name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    # Pull requests can change and execute test code. Keep them off the persistent
    # signing host and use GitHub's clean, per-job macOS VM instead.
    runs-on: macos-15
    env:
      # macos-15 currently defaults to Xcode 16.4, which cannot build this
      # swift-tools-version 6.2 package. Use the installed Xcode 26 toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Build
      run: swift build -v
    
    - name: Run Unit Tests
      run: swift test -v
    
  lint:
    name: SwiftLint
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging --strict
