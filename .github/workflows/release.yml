name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and package without publishing, to check the runner and
  # signing before tagging. The package is kept as a workflow artifact. A manual
  # run can be started from a tag too, so publishing checks the event, not the ref.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign & Release
    # A fresh GitHub-hosted VM per run. Nothing from a previous job survives,
    # so the optional signing certificate never outlives this job.
    #
    # Build with the macOS 27 SDK so the app gets the same AppKit design and
    # linked-on-or-after behavior as local builds. GitHub still labels this
    # image as beta; move to the GA macOS 27 label once it exists.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Extract version from tag
      if: github.event_name == 'push'
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$VERSION" == *-* ]]; then
          echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
        else
          echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate tag matches Info.plist channel
      if: github.event_name == 'push'
      run: |
        TAG_VERSION="${{ steps.version.outputs.VERSION }}"
        EXPECTED_CHANNEL="stable"
        EXPECTED_INFO_VERSION="$TAG_VERSION"
        if [[ "$TAG_VERSION" == *-* ]]; then
          EXPECTED_CHANNEL="beta"
          EXPECTED_INFO_VERSION="${TAG_VERSION%%-*}"
        fi

        INFO_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
        INFO_CHANNEL=$(/usr/libexec/PlistBuddy -c "Print :PriTypeReleaseChannel" Info.plist)

        if [ "$INFO_VERSION" != "$EXPECTED_INFO_VERSION" ]; then
          echo "Tag version $TAG_VERSION expects Info.plist version $EXPECTED_INFO_VERSION, found $INFO_VERSION" >&2
          exit 1
        fi

        if [ "$INFO_CHANNEL" != "$EXPECTED_CHANNEL" ]; then
          echo "Tag version $TAG_VERSION expects channel $EXPECTED_CHANNEL, found $INFO_CHANNEL" >&2
          exit 1
        fi

    - name: Run Unit Tests
      run: swift test

    # Optional. Without these secrets the app is signed ad-hoc, which works but
    # makes macOS ask for Accessibility and Input Monitoring again after every
    # update. A fixed certificate (self-signed is enough) keeps those grants.
    - name: Import signing certificate
      env:
        SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
        SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
        SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY }}
      run: |
        if [ -z "$SIGNING_P12" ]; then
          echo "No signing certificate configured; the app will be signed ad-hoc."
          exit 0
        fi
        if [ -z "$SIGNING_IDENTITY" ]; then
          echo "RELEASE_SIGNING_IDENTITY must name the certificate in RELEASE_SIGNING_P12." >&2
          exit 1
        fi

        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
        security import "$RUNNER_TEMP/signing.p12" -P "$SIGNING_P12_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        rm -f "$RUNNER_TEMP/signing.p12"

        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        echo "APP_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

    - name: Build and Package
      run: ./build_release.sh

    - name: Keep package from manual run
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: PriTypeV2_Release
        path: PriTypeV2_Release.pkg
        retention-days: 7

    - name: Create GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        name: "PriType ${{ steps.version.outputs.VERSION }}"
        # A suffixed tag (v2.8.0-beta.1) is a beta: flagging it keeps it off
        # /releases/latest, which the settings window links stable users to.
        prerelease: ${{ steps.version.outputs.PRERELEASE }}
        generate_release_notes: true
        body: |
          변경 내역은 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)에 있습니다.

          이 PKG는 Apple 공증을 받지 않았습니다. 처음 열면 macOS가 설치를 막으므로, `시스템 설정 > 개인정보 보호 및 보안`에서 **그래도 열기**를 누른 뒤 설치해 주세요.
        files: PriTypeV2_Release.pkg

    - name: Cleanup
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/signing.p12"
